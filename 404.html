<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>佳德汽車已搬家到 jdgoodcar.com</title>
<script>
// 舊網址 jdgoodcar.github.io/jiade-car/... 轉到 jdgoodcar.com 的同一頁（保留車輛編號等參數）
// 舊網址存的收藏（localStorage，跟這個轉址頁同一個網域）第一次轉過去時一起帶走：放在 #favimp=…，新網站讀到後合併
(function () {
  // 直接轉到去掉 .html 的網址（不然 Cloudflare 會再轉一次，#favimp 可能在途中弄丟）
  var p = location.pathname.replace(/^\/jiade-car(\/|$)/, '/').replace(/\/index\.html$/, '/').replace(/\.html$/, '');
  var url = 'https://jdgoodcar.com' + p + location.search;
  var hash = location.hash;
  try {
    var fav = localStorage.getItem('encarnt_fav');
    // 只有 Encar 選車的列表／車輛／收藏／比較頁會讀收藏
    if (fav && fav.length > 2 && !localStorage.getItem('encarnt_fav_moved') && /^\/encarnt\/((index|detail|fav|compare)(\.html)?)?$/.test(p)) {
      var bytes = new TextEncoder().encode(fav), bin = '';
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      hash = '#favimp=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      localStorage.setItem('encarnt_fav_moved', String(Date.now()));
    }
  } catch (e) { /* 讀不到就照常轉址 */ }
  location.replace(url + hash);
})();
</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px 16px">
<p>佳德汽車網站已搬家，正在前往新網址…</p>
<p><a href="https://jdgoodcar.com/">jdgoodcar.com</a></p>
</body>
</html>
